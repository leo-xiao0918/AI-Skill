<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  :root{
    --ink:#1a1a1a; --muted:#5b6472; --line:#d8dee9; --accent:#1a4fa0;
    --warn-bg:#fff6c8; --warn-bd:#e0b400; --card:#ffffff; --bg:#f4f6f9;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:32px 16px; background:var(--bg);
    font-family:"Songti SC","SimSun","Source Han Serif SC",Georgia,serif;
    color:var(--ink); line-height:1.85; font-size:16px;
  }
  .sheet{
    max-width:820px; margin:0 auto; background:var(--card);
    padding:44px 52px; border:1px solid var(--line); border-radius:6px;
    box-shadow:0 1px 3px rgba(0,0,0,.06);
  }
  h1{font-size:22px; margin:0 0 4px; letter-spacing:1px;}
  .meta{
    color:var(--muted); font-size:13px; margin-bottom:22px;
    padding-bottom:14px; border-bottom:2px solid var(--accent);
  }
  .question{padding:18px 0; border-bottom:1px dashed var(--line);}
  .question:last-of-type{border-bottom:none;}
  .q-head{display:flex; align-items:baseline; gap:10px; margin-bottom:8px;}
  .q-num{font-weight:700; color:var(--accent); font-size:17px;}
  .q-tag{
    font-size:12px; color:var(--muted); border:1px solid var(--line);
    border-radius:3px; padding:1px 7px;
  }
  .stem{margin:0 0 10px;}
  .options{margin:0 0 10px; padding-left:0; list-style:none;}
  .options li{padding:2px 0 2px 6px;}
  .figure{margin:12px 0; text-align:center;}
  .figure svg{max-width:100%; height:auto;}
  .figure img{max-width:100%; height:auto; border:1px solid var(--line);}
  .fig-cap{font-size:13px; color:var(--muted); margin-top:4px;}
  table{border-collapse:collapse; margin:10px 0; font-size:15px;}
  th,td{border:1px solid var(--line); padding:6px 10px; text-align:center;}
  th{background:#f0f3f8;}
  .answer,.solution{
    margin-top:10px; padding:10px 14px; background:#f7f9fc;
    border-left:3px solid var(--accent); border-radius:0 4px 4px 0;
  }
  .answer strong,.solution strong{color:var(--accent);}
  .uncertain{
    background:var(--warn-bg); border-bottom:1px dotted var(--warn-bd);
    padding:0 2px; border-radius:2px;
  }
  .missing{color:#b03030; font-style:italic;}
  .pending{
    margin-top:26px; padding:14px 18px; background:#fffaf0;
    border:1px solid #f0d9a8; border-radius:5px;
  }
  .pending h2{font-size:15px; margin:0 0 8px; color:#8a6100;}
  .pending ol{margin:0; padding-left:20px; font-size:14px;}
  math{font-family:"Cambria Math","Latin Modern Math","STIX Two Math",serif;}
  @media print{
    body{background:#fff; padding:0; font-size:11.5pt;}
    .sheet{border:none; box-shadow:none; padding:0; max-width:none;}
    .question{page-break-inside:avoid;}
  }
</style>
</head>
<body>
<div class="sheet">
  <h1>{{TITLE}}</h1>
  <div class="meta">来源：{{SOURCE}}　·　还原方式：多模态识别 + MathML 原生渲染　·　公式 LaTeX 源见 HTML 源码中的 annotation</div>
  {{BODY}}
  {{PENDING}}
</div>
</body>
</html>
